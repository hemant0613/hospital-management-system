apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service
  namespace: dynatrace
  labels:
    app: patient-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: patient-service

  template:
    metadata:
      labels:
        app: patient-service

    spec:
      containers:
      - name: patient-service

        image: hemantkrp/patient-service:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgres-db:5432/hospital_db

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"

          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10